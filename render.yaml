services:
  - type: web
    name: thinking-canvas
    runtime: node
    plan: free
    # npm ci: reproducible install from the committed package-lock.json.
    # --include=dev: Render sets NODE_ENV=production, which makes npm skip
    # devDependencies. The icon packages (@fortawesome, @material-symbols)
    # live in devDeps because they're only read at build time by the fetch
    # scripts — so we must force them in here, otherwise setup-icons fails.
    # setup-emoji uses the pinned OpenMoji release (no GitHub API call).
    buildCommand: npm ci --include=dev && npm run setup-icons && npm run setup-emoji
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"
